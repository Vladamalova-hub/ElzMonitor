<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ title }} — вход</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 80px auto; background: #f5f7fb; color: #1d2433; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; font-size: 28px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 10px; border: 1px solid #d1d9e6; }
    button { width: 100%; background: #1a73e8; color: white; border: none; border-radius: 10px; padding: 12px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ title }}</h1>
    <form method="post" action="/login">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" required>

      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required>

      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
